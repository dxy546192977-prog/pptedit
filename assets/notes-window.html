<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地讲稿编辑</title><style>body{background:#101a14;color:#e2e9e4;font:16px/1.7 system-ui;margin:32px auto;max-width:900px;padding:0 20px}textarea{box-sizing:border-box;width:100%;height:50vh;background:#070e09;color:inherit;font:inherit;padding:20px;border:1px solid #496553}button{padding:12px 20px;background:#a8d5b9;border:0;border-radius:6px;color:#102318;cursor:pointer}button:disabled{opacity:.5}#status{min-height:2em}details{margin-top:24px}pre{white-space:pre-wrap}</style><h2 id="title">本地讲稿编辑</h2><textarea id="draft" aria-label="讲稿"></textarea><p>确认后保留新增内容和原意，优化为自然的口头表达，保存后自动更新语音。</p><label>整理模型 <select id="provider" aria-label="整理模型"><option value="qwen">本地千问</option><option value="codex">Codex</option></select></label> <button id="save" disabled>确认并优化</button><p id="status" role="status">正在读取讲稿…</p><details><summary>本次优化前的草稿</summary><pre id="original"></pre></details><script>
const params=new URLSearchParams(location.hash.slice(1)),token=params.get('token'),page=Number(params.get('page')),draftInput=document.getElementById('draft'),status=document.getElementById('status'),save=document.getElementById('save');let base;const providerSelect=document.getElementById('provider');providerSelect.value=localStorage.getItem('ppt-notes-provider')||'qwen';providerSelect.onchange=()=>localStorage.setItem('ppt-notes-provider',providerSelect.value);
const initial=params.get('draft');history.replaceState(null,'',location.pathname);const key='notes-window-draft:'+page;
async function api(path,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(path,{...options,signal:controller.signal,headers:{'Content-Type':'application/json','X-Layout-Token':token}});const j=await r.json();if(!r.ok)throw Error(j.message);return j;}finally{clearTimeout(timer);}}
draftInput.oninput=()=>localStorage.setItem(key,draftInput.value);
(async()=>{try{const choices=await api('/notes-providers');for(const item of choices.providers){const option=[...providerSelect.options].find(o=>o.value===item.id);if(option){option.disabled=!item.available;option.textContent=item.label+(item.available?'':'（未安装）');}}const data=await api('/notes-state'),slide=data.slides.find(s=>s.page===page);if(!slide)throw Error('找不到当前页');base=slide.notes;document.getElementById('title').textContent=page+' · '+slide.title;draftInput.value=initial??localStorage.getItem(key)??base.join('\n\n');save.disabled=false;status.textContent='已连接本地服务，可以编辑并确认';}catch(e){status.textContent='连接失败：'+e.message;}})();
save.onclick=async()=>{const draft=draftInput.value;localStorage.setItem(key,draft);document.getElementById('original').textContent=draft;save.disabled=true;draftInput.disabled=true;providerSelect.disabled=true;status.textContent='正在提交讲稿…';try{let job=await api('/notes',{method:'POST',body:JSON.stringify({page,draft,baseNotes:base,provider:providerSelect.value})});while(['queued','running'].includes(job.state)){status.textContent=job.message+'，请稍候';await new Promise(r=>setTimeout(r,2000));job=await api('/jobs/'+job.id);}if(job.state!=='done')throw Error(job.message);base=job.notes;draftInput.value=base.join('\n\n');localStorage.removeItem(key);status.textContent=job.message+'。返回预览页面刷新即可查看。';}catch(e){status.textContent='未完成：'+e.message+'；草稿已保留。';}finally{save.disabled=false;draftInput.disabled=false;providerSelect.disabled=false;}};
</script></html>
