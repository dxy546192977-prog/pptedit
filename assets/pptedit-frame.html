body{margin:0;background:#121417;color:#e4e7ed;font:14px sans-serif}#stage{width:1920px;height:1080px;position:relative}#deck,.slide{width:100%;height:100%;position:relative}.slide>svg{display:block;width:100%;height:100%}#load-status{position:fixed;top:24px;left:24px}
/* A single source page is edited here; deck structure remains managed by its host. */
.h5ve-root [data-action="duplicate-slide"],.h5ve-root [data-action="delete-slide"]{display:none!important}
.pptedit-chapter{margin:14px 2px 4px;font-size:10px;line-height:1.6;color:#9ea8b7}
.h5ve-root .pptedit-page-link{display:block;width:100%;padding:6px;border:1px solid transparent;border-radius:4px;text-align:left;background:transparent;color:#b9c2ce;cursor:pointer}
.h5ve-root .pptedit-page-link:hover{background:#ffffff06}
.h5ve-root .pptedit-page-link[aria-current=page]{border-color:#89a8d2;color:#edf1f7;background:#ffffff05}
.pptedit-page-link img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#080a0d;border-radius:2px}
.pptedit-page-link span{display:block;margin-top:7px;font-size:11px;line-height:1.6;overflow-wrap:anywhere}
.h5ve-root .pptedit-page-link:focus-visible{outline:2px solid #adc7ee;outline-offset:1px}
.pptedit-page-feedback{line-height:1.6;white-space:normal}
.h5ve-root .pptedit-page-delete{display:block;margin:2px 0 10px auto;padding:4px 8px;border:0;border-radius:4px;background:transparent;color:#b3bbc8;font-size:11px;cursor:pointer}
.h5ve-root .pptedit-page-delete:hover{color:#ffb4ab;background:#ffb4ab12}
.h5ve-root .pptedit-page-delete:disabled{opacity:.35;cursor:default}
html:not(.pptedit-ready) #stage{visibility:hidden}
html:not(.pptedit-ready){overflow:hidden}

.h5ve-root .pptedit-page-drop-line { position: absolute; height: 2px; border-radius: 1px; background: #adc7ee; box-shadow: 0 0 0 1px #adc7ee55, 0 0 8px #adc7ee99; pointer-events: none; z-index: 5; }
